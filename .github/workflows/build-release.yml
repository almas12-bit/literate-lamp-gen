name: Build & Release Standalone Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag Versi Rilis (misal: v2.0.0)'
        required: false
        default: 'manual-build'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        shell: pwsh
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          if (-not (Test-Path "frontend/dist/index.html")) {
              throw "Frontend build output (frontend/dist/index.html) not found!"
          }

      - name: Setup Python (3.11)
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies & PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Download Portable FFmpeg & ffprobe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Write-Host "Downloading FFmpeg portable build..."
          $ffmpegUrl = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
          Get-ChildItem -Path "ffmpeg_temp" -Filter "ffmpeg.exe" -Recurse | Copy-Item -Destination "bin\ffmpeg.exe"
          Get-ChildItem -Path "ffmpeg_temp" -Filter "ffprobe.exe" -Recurse | Copy-Item -Destination "bin\ffprobe.exe"
          Remove-Item -Recurse -Force "ffmpeg_temp", "ffmpeg.zip"
          Write-Host "FFmpeg portable downloaded successfully."

      - name: Download Portable Ghostscript (GhostTrap / Artifex)
        shell: pwsh
        run: |
          Write-Host "Downloading Ghostscript Windows binaries..."
          $gsUrl = "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10040/gs10040w64.exe"
          Invoke-WebRequest -Uri $gsUrl -OutFile "gs_setup.exe"
          # 7z is preinstalled on windows-latest runner
          & 7z x gs_setup.exe -ogs_temp -y | Out-Null
          if (Test-Path "gs_temp\bin") {
              Get-ChildItem -Path "gs_temp\bin\gswin64c.exe" | Copy-Item -Destination "bin\gsc.exe"
              Get-ChildItem -Path "gs_temp\bin\gsdll64.dll" | Copy-Item -Destination "bin\gsdll64.dll"
          }
          if (Test-Path "gs_temp\iccprofiles") {
              Copy-Item -Recurse "gs_temp\iccprofiles" -Destination "bin\iccprofiles"
          }
          Remove-Item -Recurse -Force "gs_temp", "gs_setup.exe"
          Write-Host "Ghostscript portable downloaded successfully."

      - name: Compile Executable via PyInstaller
        shell: pwsh
        run: |
          pyinstaller literate_lamp.spec --clean --noconfirm
          if (-not (Test-Path "dist\LiterateLamp.exe")) {
              throw "PyInstaller failed: dist\LiterateLamp.exe not created!"
          }

      - name: Assemble Release Package
        shell: pwsh
        run: |
          $TAG = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { if ($env:INPUT_RELEASE_TAG) { $env:INPUT_RELEASE_TAG } else { 'latest' } }
          $PACKAGE_DIR = "LiterateLamp-$TAG-Windows-x64"
          New-Item -ItemType Directory -Force -Path $PACKAGE_DIR | Out-Null
          Copy-Item "dist\LiterateLamp.exe" -Destination "$PACKAGE_DIR\"
          Copy-Item -Recurse "bin" -Destination "$PACKAGE_DIR\bin"
          
          if (Test-Path ".env") {
              Copy-Item ".env" -Destination "$PACKAGE_DIR\.env.example"
          }

          @"
==============================================================
  Literate Lamp - AI Stock Media Metadata Generator
  Versi: $TAG (Windows 64-bit Standalone)
==============================================================

PANDUAN PENGGUNAAN:
1. Ekstrak seluruh isi file ZIP ini ke dalam satu folder.
2. Klik dua kali file 'LiterateLamp.exe' untuk menjalankan aplikasi.
3. Browser Anda akan terbuka secara otomatis di:
   http://localhost:8000
4. Masukkan Google Gemini API Key Anda melalui menu pengaturan.
5. Folder 'bin/' sudah berisi binari FFmpeg dan Ghostscript portabel,
   sehingga Anda TIDAK PERLU menginstal aplikasi pihak ketiga apapun.

CARA MEMATIKAN APLIKASI:
Tutup jendela hitam konsol aplikasi atau tekan Ctrl+C pada jendela tersebut.
==============================================================
"@ | Out-File -Encoding utf8 "$PACKAGE_DIR\README.txt"

          Compress-Archive -Path "$PACKAGE_DIR" -DestinationPath "$PACKAGE_DIR.zip"
          Write-Host "Release archive created: $PACKAGE_DIR.zip"
          echo "PACKAGE_ZIP=$PACKAGE_DIR.zip" >> $env:GITHUB_ENV
          echo "RELEASE_TAG=$TAG" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Literate Lamp ${{ env.RELEASE_TAG }}
          files: ${{ env.PACKAGE_ZIP }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

